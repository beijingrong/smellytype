# SmellyType voice-to-text keybindings for Sway
# Place in /etc/sway/config.d/97-smellytype.conf
#
# Push-to-talk: Hold the hotkey while speaking, release to transcribe
#
# Default: Scroll_Lock (dedicated key, no conflicts)
# Alternative: HOME key (convenient on some keyboards)
#
# Simple mode (works without binding mode):
# bindsym --no-repeat $key exec smellytype record start
# bindsym --release $key exec smellytype record stop
#
# Advanced mode (with Escape to cancel):

set $smellytype_key Scroll_Lock

# Start recording on key press, enter smellytype mode
bindsym --no-repeat $smellytype_key exec smellytype record start; mode smellytype

mode smellytype {
    # Stop recording on key release
    bindsym --release $smellytype_key exec smellytype record stop; mode default

    # Cancel with Escape (discards audio, no transcription)
    bindsym Escape exec smellytype record cancel; mode default
}
